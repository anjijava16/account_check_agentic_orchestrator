global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: agentic-banking

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
