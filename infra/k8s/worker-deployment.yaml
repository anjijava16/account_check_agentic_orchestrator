# Ingestion workers. Scaled on queue depth via KEDA, not CPU -- a backlog of
# large PDFs can sit for minutes without moving CPU on an idle pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-ingestion-worker
  namespace: agentic-banking
  labels: { app: banking-ingestion-worker, tier: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: banking-ingestion-worker }
  template:
    metadata:
      labels: { app: banking-ingestion-worker, tier: worker }
    spec:
      serviceAccountName: banking-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: registry.bank.internal/agentic-banking-platform:1.0.0
          command: ["arq", "app.workers.worker.WorkerSettings"]
          envFrom:
            - configMapRef: { name: banking-agent-config }
            - secretRef: { name: banking-agent-secrets }
          resources:
            # Parsing and embedding are CPU-hungry; give workers more headroom
            # than the API tier.
            requests: { cpu: "1000m", memory: "2Gi" }
            limits: { cpu: "4000m", memory: "8Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }   # scratch space for large PDFs
      # Long grace period: never kill a worker mid-embed and force a full retry.
      terminationGracePeriodSeconds: 300
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: banking-ingestion-worker
  namespace: agentic-banking
spec:
  scaleTargetRef:
    name: banking-ingestion-worker
  minReplicaCount: 2
  maxReplicaCount: 40
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        address: redis.agentic-banking.svc.cluster.local:6379
        listName: "arq:queue:ingestion"
        listLength: "20"
