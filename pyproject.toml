[project]
name = "agentic-banking-platform"
version = "1.0.0"
description = "Production-grade multi-agent banking assistant: LangGraph core, MCP tool servers, LiteLLM gateway, OpenSearch + pgvector retrieval, Redis session store, full observability."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  # --- API layer ---
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.3",
  "slowapi>=0.1.9",

  # --- Agent core ---
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0.2",
  "langchain-core>=0.3.20",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.2.0",
  "fastmcp>=2.0.0",

  # --- Model gateway ---
  # Library only; the LiteLLM proxy runs as its own container, and its [proxy]
  # extra pins uvicorn/gunicorn to versions that conflict with the API server.
  "litellm>=1.51.0",
  "tiktoken>=0.8.0",

  # --- Storage ---
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary,pool]>=3.2.3",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "opensearch-py[async]>=2.7.1",
  "redis>=5.2.0",
  "aioboto3>=13.2.0",
  "boto3>=1.35.0",

  # --- Ingestion / parsing ---
  "arq>=0.26.1",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "markdownify>=0.13.1",
  "tenacity>=9.0.0",

  # --- Security ---
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "cryptography>=43.0.0",

  # --- Observability ---
  "structlog>=24.4.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-instrumentation-redis>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "prometheus-client>=0.21.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
docling = ["docling>=2.14.0"]
pii = ["presidio-analyzer>=2.2.355", "presidio-anonymizer>=2.2.355"]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.2",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-redis",
  "fakeredis>=2.26.1",
  "testcontainers>=4.8.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires docker-compose stack"]
